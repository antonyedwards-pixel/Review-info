<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChicTemplateByAmanda - Design Analytics</title>
    <style>
        :root {
            --primary-color: #ff477e;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e5e7eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .timestamp {
            font-size: 0.9rem;
            color: #666666;
            background: #e9ecef;
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            margin-top: 10px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin-bottom: 25px;
        }
        h2 {
            font-size: 1.4rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f1f3f5;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        .views-badge {
            font-weight: bold;
            color: #2b8a3e;
        }
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #888888;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ChicTemplateByAmanda Analytics</h1>
            <p>Performance metrics for TikTok & Pinterest designs</p>
            <div class="timestamp">Data Refreshed: <span id="current-time">Loading...</span></div>
        </header>

        <div class="card">
            <h2>TikTok Videos</h2>
            <table>
                <thead>
                    <tr>
                        <th>Design / Video Title</th>
                        <th>Views</th>
                    </tr>
                </thead>
                <tbody id="tiktok-table">
                    <tr><td colspan="2">Loading data...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Pinterest Pins / Boards</h2>
            <table>
                <thead>
                    <tr>
                        <th>Design / Pin Board</th>
                        <th>Views / Impressions</th>
                    </tr>
                </thead>
                <tbody id="pinterest-table">
                    <tr><td colspan="2">Loading data...</td></tr>
                </tbody>
            </table>
        </div>

        <footer>
            Automated Analytics Dashboard
        </footer>
    </div>

    <script>
        // Fetches the updated data.json generated by your automated script
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('current-time').textContent = data.timestamp;

                // Populate TikTok
                const tiktokTable = document.getElementById('tiktok-table');
                tiktokTable.innerHTML = '';
                data.tiktok.forEach(item => {
                    tiktokTable.innerHTML += `<tr><td>${item.design}</td><td><span class="views-badge">${item.views}</span></td></tr>`;
                });

                // Populate Pinterest
                const pinterestTable = document.getElementById('pinterest-table');
                pinterestTable.innerHTML = '';
                data.pinterest.forEach(item => {
                    pinterestTable.innerHTML += `<tr><td>${item.design}</td><td><span class="views-badge">${item.views}</span></td></tr>`;
                });
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('current-time').textContent = "Awaiting first automated run...";
            });
    </script>
</body>
</html>
